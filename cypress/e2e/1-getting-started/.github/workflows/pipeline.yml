name: Web E2E Tests

on: 
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps: 
      # 1. Clone do projeto
      - name: Checkout do repositório
        uses: actions/checkout@v4

      # 2. Configuração do Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Instalação das dependências garantindo devDependencies
      - name: Instalar dependências
        run: npm ci
        env:
          NODE_ENV: development

      # 4. Execução dos testes
      - name: Executando os testes
        run: npx cypress run

      # 5. Upload dos artefatos (relatórios, prints e vídeos)
      - name: Upload de artefatos
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: relatorios
          path: |
            cypress/reports
            cypress/screenshots
            cypress/videos