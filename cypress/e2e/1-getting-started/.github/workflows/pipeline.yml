name: Web E2E Tests

on: 
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps: 
      # 1. Clone do projeto
      - name: Checkout do repositório
        uses: actions/checkout@v4

      # 2. Configuração do Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './pgats-automacao-web-2026/package-lock.json'

      # 3. Instalação das dependências dentro da subpasta do projeto
      - name: Instalar dependências
        working-directory: ./pgats-automacao-web-2026
        run: npm ci
        env:
          NODE_ENV: development

      # 4. Execução dos testes dentro da subpasta
      - name: Executando os testes
        working-directory: ./pgats-automacao-web-2026
        run: npx cypress run

      # 5. Upload dos artefatos (relatórios, prints e vídeos)
      - name: Upload de artefatos
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: relatorios
          path: |
            pgats-automacao-web-2026/cypress/reports
            pgats-automacao-web-2026/cypress/screenshots
            pgats-automacao-web-2026/cypress/videos