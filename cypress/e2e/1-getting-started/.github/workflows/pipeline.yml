name: Web E2E Tests

on: 
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps: 
      # 1. Clone do projeto para a máquina
      - name: Checkout do repositório
        uses: actions/checkout@v4

      # 2. Configurar o ambiente Node.js (usando cache do npm para acelerar)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Instalar as dependências do projeto (MUITO IMPORTANTE!)
      - name: Instalar dependências
        run: npm ci

      # 4. Executar os testes
      - name: Executando os testes
        run: npx cypress run

      # 5. Upload dos artefatos
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: relatorios
          path: |
            cypress/reports
            cypress/screenshots
            cypress/videos